<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="styl.css">
  <title>Frontend Mentor | Interactive rating component</title>
</head>
<body>
  <main>
    <div class="card" id="rating-card">
      <div class="star-container">
        <img src="./images/icon-star.svg" alt="Star icon" class="star-icon">
      </div>
      <h1>How did we do?</h1>
      <p>Please let us know how we did with your support request. All feedback is appreciated to help us improve our offering!</p>
      <div class="ratings">
        <button class="rating-btn" data-value="1">1</button>
        <button class="rating-btn" data-value="2">2</button>
        <button class="rating-btn" data-value="3">3</button>
        <button class="rating-btn" data-value="4">4</button>
        <button class="rating-btn" data-value="5">5</button>
      </div>
      <button class="submit-btn" id="submit-btn">SUBMIT</button>
    </div>

    <div class="card hidden" id="thankyou-card">
      <img src="./images/illustration-thank-you.svg" alt="Thank you illustration" class="thankyou-illustration">
      <div class="rating-result">You selected <span id="selected-rating">0</span> out of 5</div>
      <h1>Thank you!</h1>
      <p>We appreciate you taking the time to give a rating. If you ever need more support, don't hesitate to get in touch!</p>
    </div>
  </main>


  <script>
    let selectedRating = null;

    const ratingBtns = document.querySelectorAll('.rating-btn');
    const submitBtn = document.getElementById('submit-btn');
    const ratingCard = document.getElementById('rating-card');
    const thankyouCard = document.getElementById('thankyou-card');
    const selectedRatingSpan = document.getElementById('selected-rating');

    ratingBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        ratingBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedRating = btn.dataset.value;
      });
    });

    submitBtn.addEventListener('click', () => {
      if (selectedRating) {
        selectedRatingSpan.textContent = selectedRating;
        ratingCard.classList.add('hidden');
        thankyouCard.classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
